services:
  api:
    build:
      context: ./src/TaskManagement.Api
    environment:
      ConnectionStrings__Tasks: Data Source=/data/task-management.db
    volumes:
      - task-data:/data
    ports:
      - "5085:8080"

  web:
    build:
      context: ./src/TaskManagement.Web
      args:
        VITE_API_BASE_URL: http://localhost:5085
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  task-data:
